---
# yamllint disable rule:truthy
name: CI Checks

on:
  pull_request:
    branches:
      - main
  push:  # Also run on pushes to main to catch direct commits
    branches:
      - main

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'  # Match the version used in auto-release

      - name: Install Python for yamllint
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      - name: Install golangci-lint
        run: >-
          go install
          github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1

      - name: Install kine
        run: go install github.com/k3s-io/kine@v0.14.12

      - name: Install kube-apiserver
        run: |
          APISERVER_URL="https://dl.k8s.io/v1.35.2"
          APISERVER_URL+="/bin/linux/amd64/kube-apiserver"
          curl -fsSL "${APISERVER_URL}" \
            -o "$(go env GOPATH)/bin/kube-apiserver"
          chmod +x "$(go env GOPATH)/bin/kube-apiserver"

      - name: Run yamllint
        run: yamllint .github/workflows/auto-release.yaml .github/workflows/ci.yaml .goreleaser.yaml

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Run Release Dry-Run
        # Only run on PRs, not on direct pushes to main
        if: github.event_name == 'pull_request'
        run: goreleaser release --snapshot --clean --skip=announce,publish,validate
        env:
          # GoReleaser needs a GITHUB_TOKEN even for dry runs
          # to check API rate limits, etc.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
