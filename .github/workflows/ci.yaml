---
# yamllint disable rule:truthy
name: CI Checks

on:
  pull_request:
    branches:
      - main
  push:  # Also run on pushes to main to catch direct commits
    branches:
      - main

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'  # Match the version used in auto-release

      - name: Install Python for yamllint
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      - name: Install golangci-lint
        run: >-
          go install
          github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1

      - name: Install kine and kube-apiserver
        run: make install-test-binaries

      - name: Run yamllint
        run: >-
          yamllint
          .github/workflows/ci.yaml
          .goreleaser.yaml

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Run Release Dry-Run
        # Only run on PRs, not on direct pushes to main
        if: github.event_name == 'pull_request'
        run: >-
          goreleaser release --snapshot --clean
          --skip=announce,publish,validate
        env:
          # GoReleaser needs a GITHUB_TOKEN even for dry runs
          # to check API rate limits, etc.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
