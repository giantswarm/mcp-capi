# Team label tests for the mcp-capi Helm chart
#
# Every resource the chart renders carries application.giantswarm.io/team from
# the chart's team annotation.
suite: team label
templates:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
tests:
  - it: labels every workload with the chart team
    asserts:
      - equal:
          path: metadata.labels["application.giantswarm.io/team"]
          value: bumblebee
  - it: labels the pod template with the chart team
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["application.giantswarm.io/team"]
          value: bumblebee
