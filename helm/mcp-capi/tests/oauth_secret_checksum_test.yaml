# OAuth credentials checksum tests for the mcp-capi Helm chart
#
# The server reads its OAuth credentials (the client secret, the token
# encryption key, the Valkey password) from a Secret at start and never again.
# The pod template's checksum/oauth-secret annotation restarts it when they
# change: the SHA-256 of the chart-rendered Secret's data, or
# oauth.existingSecretChecksum verbatim for a Secret the chart does not render;
# checksum/valkey-secret carries the mark of a separate Valkey Secret. The
# pinned hashes are the SHA-256 of the Secret's data exactly as the chart
# renders it (key: base64 value per line, keys sorted); a change to that text
# rolls every installation on the next chart release.
#
# Run with: helm unittest ./helm/mcp-capi

suite: OAuth credentials checksum
templates:
  - templates/deployment.yaml
  - templates/oauth-secret.yaml
release:
  name: mcp-capi
  namespace: mcp-capi
set:
  global.domain: example.test
  oauth.dex.issuerURL: https://dex.example.test
  oauth.dex.clientID: mcp-capi
tests:
  - it: renders no pod annotations while OAuth is off
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: hashes the data of the Secret it renders
    set:
      oauth.enabled: true
      oauth.dex.clientSecret: dex-secret-1
      oauth.encryptionKey: key-1
      oauth.storage.type: valkey
      oauth.storage.valkey.url: valkey.mcp-capi.svc:6379
      oauth.storage.valkey.password: valkey-1
    asserts:
      - template: templates/deployment.yaml
        equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: a5c02a316133254638aec7f52bbd652ce5ee9750a9b749b6d304ccb48d027506
      - template: templates/deployment.yaml
        notExists:
          path: spec.template.metadata.annotations["checksum/valkey-secret"]
      - template: templates/oauth-secret.yaml
        equal:
          path: data
          value:
            dex-client-secret: ZGV4LXNlY3JldC0x
            oauth-encryption-key: a2V5LTE=
            valkey-password: dmFsa2V5LTE=

  - it: changes the checksum with a rotated credential
    template: templates/deployment.yaml
    set:
      oauth.enabled: true
      oauth.dex.clientSecret: dex-secret-2
      oauth.encryptionKey: key-1
      oauth.storage.type: valkey
      oauth.storage.valkey.url: valkey.mcp-capi.svc:6379
      oauth.storage.valkey.password: valkey-1
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: 7afe55f9aed100a8715a03564c4cabdc13f8858b59bc35bda1bc3d32f6831469

  - it: keeps podAnnotations beside the checksum
    template: templates/deployment.yaml
    set:
      podAnnotations:
        example.com/owner: bumblebee
      oauth.enabled: true
      oauth.dex.clientSecret: dex-secret-1
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: bumblebee
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          pattern: ^[0-9a-f]{64}$

  - it: renders existingSecretChecksum verbatim for a Secret it does not render
    set:
      oauth.enabled: true
      oauth.existingSecret: mcp-capi-oauth-credentials
      oauth.existingSecretChecksum: "2026-09-22T16:33:54Z"
    asserts:
      - template: templates/deployment.yaml
        equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: "2026-09-22T16:33:54Z"
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: mcp-capi-oauth-credentials
                key: dex-client-secret
      - template: templates/oauth-secret.yaml
        hasDocuments:
          count: 0

  - it: renders no annotations for an existing Secret without a revision mark
    template: templates/deployment.yaml
    set:
      oauth.enabled: true
      oauth.existingSecret: mcp-capi-oauth-credentials
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: takes the existing Secret and its mark from global.identity
    template: templates/deployment.yaml
    set:
      oauth.enabled: true
      global.identity.existingSecret: agent-platform-idp
      oauth.existingSecretChecksum: rev-3
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: rev-3

  - it: marks a separate Valkey Secret with checksum/valkey-secret
    template: templates/deployment.yaml
    set:
      oauth.enabled: true
      oauth.existingSecret: mcp-capi-oauth-credentials
      oauth.existingSecretChecksum: rev-3
      oauth.storage.type: valkey
      oauth.storage.valkey.url: valkey.mcp-capi.svc:6379
      oauth.storage.valkey.existingSecret: mcp-capi-valkey
      oauth.storage.valkey.existingSecretChecksum: "7"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: rev-3
      - equal:
          path: spec.template.metadata.annotations["checksum/valkey-secret"]
          value: "7"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mcp-capi-valkey
                key: valkey-password
                optional: true

  - it: renders no valkey mark while the password lives in the OAuth Secret
    template: templates/deployment.yaml
    set:
      oauth.enabled: true
      oauth.existingSecret: mcp-capi-oauth-credentials
      oauth.storage.type: valkey
      oauth.storage.valkey.url: valkey.mcp-capi.svc:6379
      oauth.storage.valkey.existingSecretChecksum: "7"
    asserts:
      - notExists:
          path: spec.template.metadata.annotations
