# The CiliumNetworkPolicy admits muster's pods from muster's namespace on the
# server port, nothing else from the cluster: an open ingress (the cluster
# entity) would let any pod skip muster, and Cilium policies are additive, so
# no other policy could narrow it. The gateway's proxies are admitted only
# while the chart renders its HTTPRoute.
suite: CiliumNetworkPolicy
templates:
  - templates/ciliumnetworkpolicy.yaml
tests:
  - it: renders nothing when disabled
    set:
      ciliumNetworkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: admits muster from the agent-platform namespace on the server port by default
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - equal:
          path: spec.ingress[0]
          value:
            fromEndpoints:
              - matchLabels:
                  app.kubernetes.io/name: muster
                  io.kubernetes.pod.namespace: agent-platform
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP

  - it: admits no entity but the host, for the kubelet's probes
    asserts:
      - notContains:
          path: spec.ingress
          content:
            fromEntities:
              - cluster
      - equal:
          path: spec.ingress[1]
          value:
            fromEntities:
              - host
      - lengthEqual:
          path: spec.ingress
          count: 2

  - it: admits muster from an overridden namespace
    set:
      ciliumNetworkPolicy.ingress.muster.namespace: muster
    asserts:
      - equal:
          path: spec.ingress[0].fromEndpoints
          value:
            - matchLabels:
                app.kubernetes.io/name: muster
                io.kubernetes.pod.namespace: muster

  - it: admits the gateway's proxies on the server port while the HTTPRoute renders
    set:
      gatewayAPI.enabled: true
      gatewayAPI.httpRoute.parentRefs:
        - name: giantswarm-default
          namespace: envoy-gateway-system
    asserts:
      - equal:
          path: spec.ingress[0].fromEndpoints
          value:
            - matchLabels:
                app.kubernetes.io/name: muster
                io.kubernetes.pod.namespace: agent-platform
            - matchLabels:
                app.kubernetes.io/name: envoy
                io.kubernetes.pod.namespace: envoy-gateway-system
      - lengthEqual:
          path: spec.ingress
          count: 2

  - it: admits no gateway proxy without the HTTPRoute
    asserts:
      - lengthEqual:
          path: spec.ingress[0].fromEndpoints
          count: 1
      - notContains:
          path: spec.ingress[0].fromEndpoints
          content:
            matchLabels:
              app.kubernetes.io/name: envoy
              io.kubernetes.pod.namespace: envoy-gateway-system

  - it: follows the configured gateway peers
    set:
      gatewayAPI.enabled: true
      gatewayAPI.httpRoute.parentRefs:
        - name: public
          namespace: gateways
      ciliumNetworkPolicy.ingress.gatewayPeers:
        - namespace: gateways
          matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: public
    asserts:
      - equal:
          path: spec.ingress[0].fromEndpoints[1]
          value:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: public
              io.kubernetes.pod.namespace: gateways
      - lengthEqual:
          path: spec.ingress[0].fromEndpoints
          count: 2

  - it: admits additional peers on the server port only
    set:
      ciliumNetworkPolicy.ingress.additionalPeers:
        - namespace: ingress-nginx
          matchLabels:
            app.kubernetes.io/name: ingress-nginx
    asserts:
      - equal:
          path: spec.ingress[0].fromEndpoints[1]
          value:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              io.kubernetes.pod.namespace: ingress-nginx
      - lengthEqual:
          path: spec.ingress[0].fromEndpoints
          count: 2
      - equal:
          path: spec.ingress[1]
          value:
            fromEntities:
              - host

  - it: refuses a peer without a namespace
    set:
      ciliumNetworkPolicy.ingress.additionalPeers:
        - matchLabels:
            app.kubernetes.io/name: ingress-nginx
    asserts:
      - failedTemplate: {}

  - it: keeps the egress and the endpoint selector
    asserts:
      - equal:
          path: spec.egress
          value:
            - toEntities:
                - kube-apiserver
            - toEntities:
                - cluster
      - equal:
          path: spec.endpointSelector.matchLabels
          value:
            app.kubernetes.io/name: mcp-capi
            app.kubernetes.io/instance: RELEASE-NAME

  - it: keeps the world egress with OAuth
    set:
      oauth.enabled: true
      oauth.baseURL: https://mcp-capi.example.com
    asserts:
      - contains:
          path: spec.egress
          content:
            toEntities:
              - world

  - it: carries the configured labels and annotations
    set:
      ciliumNetworkPolicy.labels:
        example.com/tier: backend
      ciliumNetworkPolicy.annotations:
        example.com/owner: bumblebee
    asserts:
      - equal:
          path: metadata.labels["example.com/tier"]
          value: backend
      - equal:
          path: metadata.annotations
          value:
            example.com/owner: bumblebee
