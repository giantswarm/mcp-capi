{{- if and .Values.oauth.enabled (not (include "mcp-capi.oauth.existingSecret" .)) -}}
{{- $provider := include "mcp-capi.oauth.provider" . -}}
{{- if and (eq $provider "dex") (not .Values.oauth.dex.clientSecret) -}}
{{- fail "oauth.dex.clientSecret is required when oauth.enabled is true with oauth.provider=dex and no existingSecret is set" -}}
{{- end -}}
{{- if and (eq $provider "google") (not .Values.oauth.google.clientSecret) -}}
{{- fail "oauth.google.clientSecret is required when oauth.enabled is true with oauth.provider=google and no existingSecret is set" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-capi.fullname" . }}-oauth
  labels:
    {{- include "mcp-capi.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "mcp-capi.oauthSecretData" . | nindent 2 }}
{{- end }}
